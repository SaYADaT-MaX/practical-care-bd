<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অর্ডার করুন</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
      background: #f0fdf4;
      margin: 0;
    }
    .order-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 400px;
      margin: 40px auto;
      box-shadow: 0 4px 15px #0001;
    }
    h1 { color: #166534; }
    p { line-height: 1.8; }
    .order-btn {
      display: inline-block;
      background: #16a34a;
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .order-btn:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="order-box">
    <h1>🛒 অর্ডার করুন</h1>
    <p>আপনার অর্ডার দিতে নিচের বাটনে চাপ দিন।</p>
    <a class="order-btn"
       href="https://docs.google.com/forms/d/e/1FAIpQLSe-AJA7npREu5w030IDLTkrLDrzhnI2oiyGJREcRtixc6csow/viewform?usp=preview"
       target="_blank"
       rel="noopener noreferrer">
      অর্ডার জমা দিন
    </a>
  </div>
</body>
</html>
